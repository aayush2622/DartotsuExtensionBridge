name: Build Plugins

on:
  push:
    branches: [master]
    paths-ignore:
      - "plugins.json"

# Needed to create/delete releases and tags.
permissions:
  contents: write

concurrency:
  group: build-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # gradlew, plugin.gradle.kts, scripts/, and builds/ all live under
    # runtimeManager/ — not at the repo root — so every `run:` step below
    # executes from there by default. Steps that need the true repo root
    # (like committing plugins.json) override this explicitly.
    defaults:
      run:
        working-directory: runtimeManager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all plugins (desktop + android + embedded-bridge)
        run: ./gradlew buildEverything

      - name: Build iOS-runtime plugin variants
        run: ./gradlew buildAllPlugins -PiosRuntime=true

      - name: Stage embedded-bridge.jar for release
        run: |
          mkdir -p builds/embeddedBridge
          cp libraries/commonDesktopLib/build/libs/embedded-bridge.jar \
             builds/embeddedBridge/embedded-bridge.jar

      - name: Download previous release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-release
          gh release download latest \
            --repo "${{ github.repository }}" \
            --dir previous-release \
            --clobber \
          || echo "No previous 'latest' release found — treating every plugin as new."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare artifacts and bump versions
        id: release-prep
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare_release.py

      - name: Publish plugins.json to repo root
        working-directory: ${{ github.workspace }}
        run: |
          cp runtimeManager/builds/plugins.json plugins.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add plugins.json

          if git diff --cached --quiet; then
            echo "plugins.json unchanged — nothing to commit."
          else
            git commit -m "chore: update plugins.json"
            git push
          fi

      - name: Delete previous release and tag
        if: steps.release-prep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "${{ github.repository }}" \
            --yes \
            --cleanup-tag \
          || echo "No previous release to delete."

      - name: Create release and upload artifacts
        if: steps.release-prep.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find builds -type f \( -name '*.apk' -o -name '*.jar' -o -name '*.json' \))
          gh release create latest \
            --repo "${{ github.repository }}" \
            --title "Latest Build" \
            --notes "Automated build from ${{ github.sha }}" \
            "${assets[@]}"

      - name: No changes detected
        if: steps.release-prep.outputs.changed != 'true'
        run: echo "All plugin artifacts are unchanged — skipping release."

  # `build` above covers the JVM half of iOS support (`buildAllPlugins
  # -PiosRuntime=true` produces the *-plugin-ios.jar variants). It never
  # touches the native side — ios/Classes/*.swift,*.mm and the podspec's
  # `prepare_command` (ios/PrepareEmbeddedRuntime.sh), which builds the
  # embedded OpenJDK Zero xcframework — because that needs a macOS runner.
  #
  # This job runs example/integration_test/embedded_jvm_test.dart on a real
  # iOS Simulator: for every backend that goes through the embedded JVM
  # (Aniyomi/CloudStream/IReader/Tsundoku/Kotatsu — Mangayomi/Sora/LnReader/
  # Legado are pure-Dart and never touch this path), it loads that backend's
  # *-plugin-ios.jar into the VM and makes real calls (`ping`,
  # `initializeDesktop`). That exercises the whole chain for real: `pod
  # install` → the podspec → prepare_command → the OpenJDK xcframework build
  # → EmbeddedJvm.mm/DartotsuExtensionBridgePlugin.swift compiling against
  # it → the app actually booting the VM at runtime and getting a real
  # response back. Not just "does it compile".
  #
  # Independent of `build` (no `needs:`) so a flaky/broken iOS leg can't
  # block the existing plugin-artifact release pipeline, and vice versa.
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # PrepareEmbeddedRuntime.sh falls back to `/usr/libexec/java_home
          # -v 21` to compile the java.util.logging shim if $JAVA_HOME isn't
          # already a JDK 21.
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the embedded-bridge shim jar + iOS backend plugin jars
        # Only the 5 Desktop modules' buildPlugin tasks, not the blanket
        # `buildAllPlugins` — that also depends on the *Android modules'
        # buildPlugin, and this runner has no Android SDK set up (the `build`
        # job on ubuntu-latest already builds + verifies those).
        working-directory: runtimeManager
        run: |
          ./gradlew buildEmbeddedBridge \
            :aniyomi:aniyomiDesktop:buildPlugin \
            :cloudStream:cloudStreamDesktop:buildPlugin \
            :ireader:ireaderDesktop:buildPlugin \
            :tsundoku:tsundokuDesktop:buildPlugin \
            :kotatsu:kotatsuDesktop:buildPlugin \
            -PiosRuntime=true

      - name: Stage embedded-bridge.jar for the iOS pod
        # PrepareEmbeddedRuntime.sh skips its own download of this jar (a
        # release under the `embedded-ios-v1` tag that doesn't exist yet —
        # see runtimeManager/EMBEDDED_IOS_NOTES.md, "Still on you" #4/#5)
        # once it's already sitting at ios/Runtime/embedded-bridge.jar. CI
        # just built one, so stage it directly instead of round-tripping
        # through a release.
        run: |
          mkdir -p ios/Runtime
          cp runtimeManager/libraries/commonDesktopLib/build/libs/embedded-bridge.jar \
             ios/Runtime/embedded-bridge.jar

      - name: Stage backend plugin jars for the integration test
        run: |
          mkdir -p example/assets/plugins
          for plugin in aniyomiDesktop cloudStreamDesktop ireaderDesktop tsundokuDesktop kotatsuDesktop; do
            cp "runtimeManager/builds/${plugin}/${plugin}-plugin-ios.jar" \
               "example/assets/plugins/${plugin}-plugin-ios.jar"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Precache iOS engine artifacts
        run: flutter precache --ios

      - name: Resolve example app dependencies
        working-directory: example
        run: flutter pub get

      - name: List available simulators (diagnostic)
        run: xcrun simctl list devices available

      - name: Boot an iOS Simulator
        # `flutter devices` (and therefore `flutter test -d`) only lists
        # *booted* simulators — it does not boot a shutdown one for you the
        # way `flutter run -d <name>` can for some device types. Picks the
        # first available iPhone-family simulator rather than pinning an
        # exact model, since that changes across Xcode/runner-image versions.
        run: |
          UDID=$(xcrun simctl list devices available iPhone -j | jq -r '[.devices[][] | select(.isAvailable)][0].udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi
          echo "Booting simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run the embedded JVM integration test on an iOS Simulator
        working-directory: example
        run: flutter test integration_test/embedded_jvm_test.dart -d "$SIMULATOR_UDID"