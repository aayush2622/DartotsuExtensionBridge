name: ffmpeg-mini

on:
  workflow_dispatch:
    inputs:
      version:
        description: FFmpeg version
        default: "7.1.1"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            deps: ""
          - target: linux-arm64
            os: ubuntu-latest
            deps: gcc-aarch64-linux-gnu
          - target: windows-x64
            os: ubuntu-latest
            deps: gcc-mingw-w64-x86-64
          - target: android-arm64
            os: ubuntu-latest
            deps: ""
          - target: macos-arm64
            os: macos-14
            deps: ""
          - target: macos-x64
            os: macos-14
            deps: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        if: matrix.deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}
      - name: Build
        run: ./scripts/build_ffmpeg.sh ${{ matrix.target }} ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ffmpeg-mini -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create ffmpeg-mini -R "$GITHUB_REPOSITORY" \
                 --title "FFmpeg (remux only)" \
                 --notes "Minimal FFmpeg builds used by the Dartotsu downloader to turn HLS into mp4. No encoders, filters or network code."
          gh release upload ffmpeg-mini dist/* --clobber -R "$GITHUB_REPOSITORY"
