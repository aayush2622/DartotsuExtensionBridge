name: ffmpeg-mini

on:
  workflow_dispatch:
    inputs:
      version:
        description: FFmpeg version
        default: "7.1.1"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            deps: ""
          - target: linux-arm64
            os: ubuntu-latest
            deps: gcc-aarch64-linux-gnu
          - target: windows-x64
            os: ubuntu-latest
            deps: gcc-mingw-w64-x86-64
          - target: android-arm64
            os: ubuntu-latest
            deps: ""
          - target: macos-arm64
            os: macos-14
            deps: ""
          - target: macos-x64
            os: macos-14
            deps: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        if: matrix.deps != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.deps }}
      - name: Build
        run: ./scripts/build_ffmpeg.sh ${{ matrix.target }} ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/*


  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build device slice
        run: ./scripts/build_ffmpeg_ios.sh ios-arm64 ${{ inputs.version }}
      - name: Build simulator slice
        run: ./scripts/build_ffmpeg_ios.sh ios-sim-arm64 ${{ inputs.version }}
      - name: Create xcframework
        run: |
          xcodebuild -create-xcframework \
            -library dist/libdartotsu_ffmpeg-ios-arm64.a -headers ios/FfmpegRuntime/include \
            -library dist/libdartotsu_ffmpeg-ios-sim-arm64.a -headers ios/FfmpegRuntime/include \
            -output dist/DartotsuFfmpeg.xcframework
          ditto -c -k --sequesterRsrc --keepParent dist/DartotsuFfmpeg.xcframework dist/DartotsuFfmpeg.xcframework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DartotsuFfmpeg.xcframework
          path: dist/DartotsuFfmpeg.xcframework.zip
