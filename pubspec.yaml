name: dartotsu_extension_bridge
description: "A new Flutter plugin project."
version: 0.0.5
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  archive: ^4.5.1
  image: ^4.5.4
  plugin_platform_interface: ^2.1.8
  http: ^1.6.0
  isar_community: ^3.4.1
  isar_community_flutter_libs: ^3.4.1
  d4rt: ^0.2.4
  get: ^4.7.3
  path_provider: ^2.1.6
  path: ^1.9.1
  http_interceptor: ^3.0.0
  html: ^0.15.7
  intl: any
  webview_all: ^1.4.6
  pseudom: ^1.0.1
  encrypt: ^5.0.3
  convert: ^3.1.2
  xpath_selector_html_parser: ^3.0.1
  js_packer: ^0.0.6
  crypto: ^3.0.7
  wasd: ^0.5.2
  flutter_qjs:
    git:
      url: https://github.com/aayush2622/flutter_qjs.git
      ref: dartotsu-ios-exedir-fix

  epubx:
    git:
      url: https://github.com/kodjodevf/epubx.dart.git
      ref: dev
  install_plugin: ^2.1.0
  installed_apps: ^2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.4.1
  build_runner: ^2.15.0

flutter:
  assets:
    - assets/images/
  plugin:
    platforms:
      android:
        package: com.aayush262.dartotsu_extension_bridge
        pluginClass: DartotsuExtensionBridgePlugin
      ios:
        pluginClass: DartotsuExtensionBridgePlugin
      linux:
        pluginClass: DartotsuExtensionBridgePlugin
      windows:
        pluginClass: DartotsuExtensionBridgePluginCApi

