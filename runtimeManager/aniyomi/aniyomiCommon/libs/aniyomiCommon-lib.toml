[versions]
serialization = "1.11.0"

rxjava = "1.3.8"
bencode = "1.4.2"
nanohttpd = "2.3.1"
[libraries]

# Serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
serialization-json-okio = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-okio", version.ref = "serialization" }
serialization-protobuf = { module = "org.jetbrains.kotlinx:kotlinx-serialization-protobuf", version.ref = "serialization" }

rxjava = { module = "io.reactivex:rxjava", version.ref = "rxjava" }

bencode = { module = "com.dampcake:bencode", version.ref = "bencode" }

# extensions-lib 17's AnimeHttpSource.createHttpServer() returns a HttpServer
# that subclasses NanoHTTPD - same library aniyomi itself uses.
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }

[bundles]
common = [
    "serialization-json",
    "serialization-json-okio",
    "serialization-protobuf",
    "rxjava",
    "bencode",
    "nanohttpd",
]